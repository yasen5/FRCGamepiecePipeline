[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frc-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["sapien==3.0.3", "nicegui==4.0.0", "numpy>=1.26", "opencv-python-headless>=4.10", "Pillow>=10", "pydantic>=2", "trimesh>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1.400"]

[project.scripts]
frc-sim = "frc_sim.__main__:main"

[tool.setuptools.packages.find]
include = ["frc_sim*"]

[tool.pyright]
include = ["frc_sim", "tests", "old_scripts_for_review"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
